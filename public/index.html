<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Libros</title>
  
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>

  <div class="app-layout">
    
    <header class="app-header">
     <div class="header-title">
      <span class="header-emoji">📚</span>
        <h1>Gestor de libros</h1>
     </div>
      <button id="btn-open-modal" class="btn-primary">+ Nuevo libro</button>
    </header>

   
    <section class="toolbar">
      <div class="search-field">
        <input type="text" id="search-input" placeholder="Buscar por título, autor o género...">
      </div>

      <div class="filter-field">
        <select id="filter-genre">
          <option value="">Todos los géneros</option>
          <option value="Ficción">Ficción</option>
          <option value="No Ficción">No Ficción</option>
          <option value="Fantasía">Fantasía</option>
          <option value="Técnico">Técnico</option>
        </select>
      </div>
    </section>

    <div id="status-message" class="status-hidden"></div>

    <!-- Contenedor Principal de Datos -->
    <main id="books-container" class="content-area">
      <div class="empty-state">
        <p>Cargando registros...</p>
      </div>
    </main>
  </div>

  <!-- Modal Formulario -->
  <dialog id="book-modal">
    <div class="modal-wrapper">
      <div class="modal-header">
        <h2 id="modal-title">Registrar Libro</h2>
        <p id="modal-subtitle">Introduce la información completa para actualizar el catálogo.</p>
      </div>

      <form id="book-form">
        <div class="form-group">
          <label for="title">Título del libro</label>
          <input type="text" id="title" placeholder="Nombre completo" required>
        </div>

        <div class="form-group">
          <label for="author">Autor</label>
          <input type="text" id="author" placeholder="Nombre del autor/a" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="genre">Género</label>
            <input type="text" id="genre" placeholder="Categoría" required>
          </div>

          <div class="form-group">
            <label for="status">Estado de lectura</label>
            <select id="status">
              <option value="pendiente">Pendiente</option>
              <option value="leyendo">Leyendo</option>
              <option value="terminado">Completado</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="rating">Calificación (1 al 5)</label>
          <input type="number" id="rating" min="1" max="5" value="5">
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-close-modal" class="btn-secondary">Cancelar</button>
          <button type="submit" id="btn-submit-form" class="btn-primary">Guardar registro</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
